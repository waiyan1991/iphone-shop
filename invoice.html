<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iCrave — Invoice</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f0f5;
            min-height: 100vh;
            color: #111;
        }

        .app-bar {
            background: #fff;
            border-bottom: 1px solid #e5e5ea;
            padding: 0 20px;
            height: 56px;
            display: flex;
            align-items: center;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.06);
        }

        .app-bar img {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            object-fit: cover;
        }

        .app-bar span {
            font-size: 15px;
            font-weight: 700;
            color: #111;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        .search-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .search-card h2 {
            font-size: 15px;
            font-weight: 700;
            color: #111;
            margin-bottom: 14px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .input-row input {
            flex: 1;
            background: #f5f5fa;
            border: 1.5px solid #e5e5ea;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 15px;
            font-family: monospace;
            font-weight: 600;
            color: #111;
            outline: none;
            letter-spacing: 1px;
            transition: border-color 0.2s;
        }

        .input-row input:focus {
            border-color: #6c63ff;
        }

        .btn-search {
            background: linear-gradient(135deg, #6c63ff, #8b5cf6);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-search:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .buyer-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .buyer-row input {
            background: #f5f5fa;
            border: 1.5px solid #e5e5ea;
            border-radius: 10px;
            padding: 11px 13px;
            font-size: 13px;
            font-family: inherit;
            color: #111;
            outline: none;
            transition: border-color 0.2s;
        }

        .buyer-row input:focus {
            border-color: #6c63ff;
        }

        .error-msg {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 12px 14px;
            color: #ef4444;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }

        /* INVOICE */
        .invoice-wrap {
            display: none;
        }

        .print-btn-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn-print {
            background: linear-gradient(135deg, #6c63ff, #8b5cf6);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-reset {
            background: #fff;
            color: #6c63ff;
            border: 1.5px solid #6c63ff;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }

        /* A4 PAGE — shared by front (invoice) & back (terms) */
        .a4-page {
            background: #fff;
            width: 100%;
            max-width: 480px;
            margin: 0 auto 20px;
            border-radius: 16px;
            padding: 24px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
            z-index: 0;
        }

        .page-tag {
            position: absolute;
            top: 10px;
            right: 14px;
            font-size: 10px;
            color: #ccc;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-32deg);
            font-size: 78px;
            font-weight: 800;
            letter-spacing: 4px;
            color: rgba(108, 99, 255, 0.12);
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            z-index: -1;
        }

        /* FRONT PAGE — plain voucher style (matches shop's hand-written format) */
        .voucher-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1.5px solid #222;
        }

        .voucher-logo {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1.5px solid #222;
            object-fit: cover;
        }

        .voucher-shopname {
            font-size: 16px;
            font-weight: 700;
            color: #111;
        }

        .voucher-top-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 14px;
        }

        .voucher-field {
            font-size: 11px;
        }

        .voucher-field .lbl {
            display: block;
            color: #888;
            font-size: 9.5px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 3px;
        }

        .voucher-field .val {
            display: block;
            font-weight: 700;
            color: #111;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 4px;
            min-height: 16px;
        }

        .voucher-field.wide {
            grid-column: 1 / -1;
        }

        .voucher-cust-row {
            display: grid;
            grid-template-columns: 1fr;
            margin-bottom: 8px;
        }

        .voucher-table {
            width: 100%;
            border-collapse: collapse;
            margin: 14px 0 10px;
            font-size: 11px;
        }

        .voucher-table th,
        .voucher-table td {
            border: 1px solid #222;
            padding: 6px 6px;
            text-align: left;
        }

        .voucher-table th {
            background: #f4f4f4;
            font-size: 9.5px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #333;
        }

        .voucher-table td.num,
        .voucher-table th.num {
            text-align: right;
        }

        .voucher-totals {
            margin: 10px 0 18px;
        }

        .voucher-totals .row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 5px 0;
            border-bottom: 1px dashed #e2e2e2;
        }

        .voucher-totals .row.sub {
            padding-left: 14px;
            color: #888;
            font-size: 11px;
        }

        .voucher-totals .row.grand {
            border-top: 1.5px solid #222;
            border-bottom: none;
            margin-top: 4px;
            padding-top: 10px;
            font-size: 14px;
            font-weight: 800;
            color: #111;
        }

        .voucher-sign-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 30px;
            font-size: 11px;
            color: #555;
        }

        .voucher-sign-row .line {
            border-top: 1px solid #999;
            margin-top: 34px;
            padding-top: 5px;
        }

        .voucher-footer {
            margin-top: 22px;
            padding-top: 12px;
            border-top: 1px solid #eee;
            font-size: 10px;
            color: #888;
            line-height: 1.7;
        }


            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 2px solid #6c63ff;
        }

        .inv-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .inv-brand img {
            width: 40px;
            height: 40px;
            border-radius: 9px;
            object-fit: cover;
        }

        .inv-brand-name {
            font-size: 20px;
            font-weight: 800;
            color: #6c63ff;
            letter-spacing: -0.5px;
        }

        .inv-brand-sub {
            font-size: 10px;
            color: #999;
            margin-top: 1px;
        }

        .inv-title-box {
            text-align: right;
        }

        .inv-title {
            font-size: 11px;
            font-weight: 700;
            color: #6c63ff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .inv-no {
            font-size: 11px;
            color: #999;
            margin-top: 2px;
        }

        /* top meta strip — mimics the iSure "Invoice Date / Ref / Invoice No / Branch" row */
        .inv-strip {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 11px;
            margin-bottom: 14px;
        }

        .inv-strip-item .k {
            color: #aaa;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .inv-strip-item .v {
            color: #222;
            font-weight: 700;
            font-size: 12px;
        }

        .inv-section-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .inv-buyer-box {
            background: #f8f8ff;
            border: 1px solid #ebebff;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 14px;
        }

        /* item table — mimics SKU / Brand / Item / Options / Qty / Price columns */
        .item-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 4px;
            font-size: 11px;
        }

        .item-table th {
            text-align: left;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #aaa;
            font-weight: 700;
            padding: 6px 4px;
            border-bottom: 1.5px solid #ebebff;
        }

        .item-table td {
            padding: 8px 4px;
            border-bottom: 1px solid #f2f2f8;
            vertical-align: top;
            color: #333;
        }

        .item-table .item-name {
            font-weight: 700;
            color: #111;
        }

        .item-table .item-opts {
            font-size: 10px;
            color: #888;
            margin-top: 2px;
        }

        .item-table .item-serial {
            font-size: 9.5px;
            color: #aaa;
            font-family: monospace;
            margin-top: 4px;
        }

        .item-table .num {
            text-align: right;
            white-space: nowrap;
        }

        .totals-box {
            margin-top: 10px;
            margin-bottom: 16px;
        }

        .totals-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 4px 0;
            color: #555;
        }

        .totals-row.grand {
            border-top: 1.5px solid #ebebff;
            margin-top: 4px;
            padding-top: 10px;
            font-size: 15px;
            font-weight: 800;
            color: #111;
        }

        .paid-stamp {
            display: inline-block;
            border: 3px solid #6c63ff;
            color: #6c63ff;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 2px;
            padding: 6px 16px;
            border-radius: 8px;
            transform: rotate(-6deg);
            opacity: 0.85;
            margin: 10px 0 16px;
        }

        .sign-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 24px;
            font-size: 10px;
            color: #999;
        }

        .sign-row .line {
            border-top: 1px solid #ddd;
            margin-top: 30px;
            padding-top: 4px;
        }

        .inv-footer {
            text-align: center;
            padding-top: 14px;
            margin-top: 10px;
            border-top: 1px solid #f0f0f0;
        }

        .inv-footer p {
            font-size: 10px;
            color: #bbb;
            line-height: 1.7;
        }

        .inv-footer .brand {
            font-size: 12px;
            font-weight: 700;
            color: #6c63ff;
            margin-top: 5px;
        }

        /* BACK PAGE — terms & conditions */
        .terms-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #6c63ff;
        }

        .terms-header img {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            object-fit: cover;
        }

        .terms-header .t {
            font-size: 14px;
            font-weight: 800;
            color: #6c63ff;
        }

        .terms-header .d {
            margin-left: auto;
            font-size: 10px;
            color: #aaa;
        }

        .terms-section {
            margin-bottom: 14px;
        }

        .terms-section h4 {
            font-size: 11px;
            font-weight: 700;
            color: #6c63ff;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .terms-section ol,
        .terms-section ul {
            padding-left: 18px;
        }

        .terms-section li {
            font-size: 11.5px;
            line-height: 1.6;
            color: #444;
            margin-bottom: 5px;
        }

        .terms-ack {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px dashed #ddd;
        }

        .terms-ack p {
            font-size: 11px;
            color: #666;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .terms-sign-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            font-size: 10.5px;
            color: #888;
        }

        .terms-sign-row .line {
            border-top: 1px solid #ccc;
            margin-top: 28px;
            padding-top: 4px;
        }

        .loading-spinner {
            text-align: center;
            padding: 30px;
            color: #888;
            display: none;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid #e5e5ea;
            border-top-color: #6c63ff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media print {
            @page {
                size: A4;
                margin: 12mm;
            }

            body {
                background: white;
            }

            .app-bar,
            .search-card,
            .print-btn-row,
            .page-tag {
                display: none !important;
            }

            .invoice-wrap {
                display: block !important;
            }

            .container {
                padding: 0;
                max-width: 100%;
            }

            .a4-page {
                box-shadow: none;
                border-radius: 0;
                max-width: 100%;
                padding: 0;
                margin: 0;
            }

            /* front page ends, back page (terms) starts on a fresh sheet */
            .a4-page.front {
                page-break-after: always;
            }
        }
    </style>
</head>

<body>

    <div class="app-bar">
        <img src="/favicon.png" alt="iCrave" />
        <span>iCrave — Invoice</span>
    </div>

    <div class="container">
        <div class="search-card">
            <h2>🧾 Invoice ထုတ်မည်</h2>
            <div class="input-row">
                <input type="tel" id="imei-input" placeholder="IMEI ထည့်ပါ..." maxlength="15" inputmode="numeric" />
                <button class="btn-search" id="search-btn" onclick="searchPhone()">ရှာမည်</button>
            </div>
            <div class="buyer-row">
                <input type="text" id="buyer-name" placeholder="ဝယ်သူအမည်..." />
                <input type="text" id="buyer-phone" placeholder="ဖုန်းနံပါတ်..." />
            </div>
            <div class="buyer-row" style="margin-top:8px">
                <input type="text" id="warranty-period" placeholder="Warranty ကာလ (ဥပမာ - 3 လ)" />
                <input type="text" id="refund-pct" placeholder="ပြန်ရောင်း နုတ်ရမည့် % (ဥပမာ - 10)" />
            </div>
            <div class="buyer-row" style="margin-top:8px">
                <input type="text" id="exchange-pct" placeholder="အလဲအထပ် နုတ်ရမည့် % (ဥပမာ - 5)" />
                <input type="text" id="ceir-number" placeholder="CEIR (ရှိပါက)" />
            </div>
            <div class="buyer-row" style="margin-top:8px">
                <input type="number" id="discount-amount" placeholder="Discount (Ks)" />
                <input type="number" id="paid-mmk" placeholder="Total Paid MMK (Ks)" />
            </div>
            <div class="buyer-row" style="margin-top:8px">
                <input type="number" id="paid-qr" placeholder="Paid by QR (Ks)" />
                <input type="number" id="paid-banking" placeholder="Paid by Banking (Ks)" />
            </div>
            <div class="error-msg" id="error-msg"></div>
        </div>

        <div class="loading-spinner" id="loading">
            <div class="spinner"></div>
            Loading...
        </div>

        <div class="invoice-wrap" id="invoice-wrap">
            <div class="print-btn-row">
                <button class="btn-print" onclick="window.print()">🖨️ Print လုပ်မည် (Front + Back)</button>
                <button class="btn-reset" onclick="resetForm()">↺ အသစ်ထုတ်မည်</button>
            </div>

            <!-- FRONT: invoice details -->
            <div class="a4-page front" id="invoice-front">
                <div class="page-tag">FRONT — A4</div>
            </div>

            <!-- BACK: terms & conditions -->
            <div class="a4-page back" id="invoice-back">
                <div class="page-tag">BACK — A4</div>
            </div>
        </div>
    </div>

    <script>
        const SURL = 'https://bilowmtnmfymccbgvafz.supabase.co';
        const KEY = 'sb_publishable_kBWsQDvwBd5oixD5FxLu8w_062sRH_C';

        // ---- SHOP INFO ----
        const SHOP_NAME    = 'iCrave';
        const SHOP_SUB     = 'Premium Second Hand iPhones';
        const SHOP_ADDRESS = 'No.6, Paw Taw Mu 2nd Street, 2 Quarter, Thamine Junction, Mayangone Township, Yangon.';
        const SHOP_HOTLINE = '09789156464';
        const SHOP_CS_NUMBERS = ['09789156464', '09256423922', '09975038285', '09420158811'];
        // ------------------------------------

        function fmt(num) {
            if (!num && num !== 0) return '—';
            return Number(num).toLocaleString() + ' Ks';
        }

        document.getElementById('imei-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') searchPhone();
        });

        async function searchPhone() {
            const imei = document.getElementById('imei-input').value.trim();
            const errEl = document.getElementById('error-msg');
            errEl.style.display = 'none';

            if (!imei) { showError('IMEI ထည့်ပါ'); return; }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('invoice-wrap').style.display = 'none';
            document.getElementById('search-btn').disabled = true;

            try {
                const res = await fetch(`${SURL}/rest/v1/iphones?imei=eq.${encodeURIComponent(imei)}&select=*`, {
                    headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` }
                });
                const data = await res.json();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('search-btn').disabled = false;

                if (!data || data.length === 0) {
                    showError('ဒီ IMEI နဲ့ ဖုန်း မတွေ့ပါ');
                    return;
                }

                renderInvoice(data[0]);
            } catch (e) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('search-btn').disabled = false;
                showError('Error: ' + e.message);
            }
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function renderInvoice(p) {
            const buyer = document.getElementById('buyer-name').value.trim() || '—';
            const buyerPhone = document.getElementById('buyer-phone').value.trim() || '—';
            const now = new Date();
            const today = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            const timeNow = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
            const invNo = 'INV-' + Date.now().toString().slice(-6);
            const price = Number(p.sell_price || p.buy_price || 0);

            const blank = (v) => v ? v : '_______';
            const warrantyPeriod = blank(document.getElementById('warranty-period').value.trim());
            const refundPct      = blank(document.getElementById('refund-pct').value.trim());
            const exchangePct    = blank(document.getElementById('exchange-pct').value.trim());
            const ceirNumber     = document.getElementById('ceir-number').value.trim();

            const discount = Number(document.getElementById('discount-amount').value) || 0;
            const paidMMK  = Number(document.getElementById('paid-mmk').value) || 0;
            const paidQR   = Number(document.getElementById('paid-qr').value) || 0;
            const paidBank = Number(document.getElementById('paid-banking').value) || 0;
            const paidSum  = paidMMK + paidQR + paidBank;
            const totalReceived = paidSum > 0 ? paidSum : (price - discount);

            const ks = (n) => n ? Number(n).toLocaleString() : '—';

            // ---- FRONT PAGE ----
            document.getElementById('invoice-front').innerHTML = `
    <div class="page-tag">FRONT — A4</div>
    <div class="watermark">${SHOP_NAME}</div>
    <div class="voucher-header">
      <img class="voucher-logo" src="/favicon.png" alt="${SHOP_NAME}" />
      <div class="voucher-shopname">${SHOP_NAME}</div>
    </div>

    <div class="voucher-top-row">
      <div class="voucher-field"><span class="lbl">Invoice No</span><span class="val">${invNo}</span></div>
      <div class="voucher-field"><span class="lbl">Invoice Date</span><span class="val">${today}</span></div>
