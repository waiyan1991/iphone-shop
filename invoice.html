<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iCrave — Invoice</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f0f5;
            min-height: 100vh;
            color: #111;
        }

        .app-bar {
            background: #fff;
            border-bottom: 1px solid #e5e5ea;
            padding: 0 20px;
            height: 56px;
            display: flex;
            align-items: center;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.06);
        }

        .app-bar img {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            object-fit: cover;
        }

        .app-bar span {
            font-size: 15px;
            font-weight: 700;
            color: #111;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        .search-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .search-card h2 {
            font-size: 15px;
            font-weight: 700;
            color: #111;
            margin-bottom: 14px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .input-row input {
            flex: 1;
            background: #f5f5fa;
            border: 1.5px solid #e5e5ea;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 15px;
            font-family: monospace;
            font-weight: 600;
            color: #111;
            outline: none;
            letter-spacing: 1px;
            transition: border-color 0.2s;
        }

        .input-row input:focus {
            border-color: #6c63ff;
        }

        .btn-search {
            background: linear-gradient(135deg, #6c63ff, #8b5cf6);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-search:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .buyer-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .buyer-row input {
            background: #f5f5fa;
            border: 1.5px solid #e5e5ea;
            border-radius: 10px;
            padding: 11px 13px;
            font-size: 13px;
            font-family: inherit;
            color: #111;
            outline: none;
            transition: border-color 0.2s;
        }

        .buyer-row input:focus {
            border-color: #6c63ff;
        }

        .foc-check-row {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            background: #f5f5fa;
            border: 1.5px solid #e5e5ea;
            border-radius: 10px;
            padding: 11px 13px;
            font-size: 13px;
            color: #333;
        }

        .foc-check-row label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .foc-check-row input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: #6c63ff;
            cursor: pointer;
        }

        .error-msg {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 12px 14px;
            color: #ef4444;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }

        /* INVOICE */
        .invoice-wrap {
            display: none;
        }

        .print-btn-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn-print {
            background: linear-gradient(135deg, #6c63ff, #8b5cf6);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-reset {
            background: #fff;
            color: #6c63ff;
            border: 1.5px solid #6c63ff;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }

        /* A4 PAGE — Shared by Screen and Print */
        .a4-page {
            background: #fff;
            width: 100%;
            max-width: 480px;
            margin: 0 auto 20px;
            border-radius: 16px;
            padding: 28px 22px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
            z-index: 0;
            display: flex;
            flex-direction: column;
        }

        .page-tag {
            position: absolute;
            top: 10px;
            right: 14px;
            font-size: 10px;
            color: #999;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-32deg);
            font-size: 78px;
            font-weight: 800;
            letter-spacing: 4px;
            color: rgba(108, 99, 255, 0.12);
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            z-index: -1;
        }

        /* FRONT PAGE — typography matched to back page scale */
        .voucher-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1.5px solid #222;
        }

        .voucher-logo {
            width: 68px;
            height: 68px;
            border-radius: 0;
            border: none;
            object-fit: cover;
        }

        .voucher-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .voucher-field {
            font-size: 12.5px;
            line-height: 1.75;
        }

        .voucher-field .lbl {
            display: block;
            color: #666;
            font-size: 10.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 5px;
        }

        .voucher-field .val {
            display: block;
            font-weight: 700;
            color: #222;
            border-bottom: 1px dashed #bbb;
            padding-bottom: 5px;
            min-height: 18px;
        }

        .voucher-field.wide {
            width: 100%;
        }

        .voucher-top-row .voucher-field .val {
            color: #333;
            font-weight: 800;
            font-size: 13px;
            border-bottom: 1.5px solid #666;
        }

        .voucher-top-row .voucher-field .lbl {
            color: #555;
            font-weight: 700;
        }

        .voucher-cust-row {
            display: grid;
            grid-template-columns: 1fr;
            margin-bottom: 14px;
        }

        .item-list {
            margin: 20px 0 16px;
            font-size: 12.5px;
            line-height: 1.75;
            border-radius: 6px;
            overflow: hidden;
        }

        .item-list .item-list-head,
        .item-list .item-list-row {
            display: grid;
            grid-template-columns: 0.5fr 2fr 2fr 1fr 0.6fr 1fr;
            gap: 4px;
            padding: 9px 6px;
            align-items: center;
            text-align: left;
        }

        .item-list .item-list-head {
            background: #ececec;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #222;
            font-weight: 700;
        }

        .item-list .item-list-row {
            border-bottom: 1px solid #eee;
        }

        .item-list .item-list-row.foc {
            color: #111;
            font-weight: 400;
        }

        .item-list .item-opts {
            display: block;
            font-size: 10px;
            color: #888;
            font-weight: 400;
            margin-top: 2px;
        }

        .item-list .num {
            text-align: right;
        }

        .voucher-totals {
            margin: 16px 0 24px;
            font-size: 12.5px;
            line-height: 1.75;
        }

        .voucher-totals .row {
            display: flex;
            justify-content: space-between;
            font-size: 12.5px;
            padding: 6px 0;
            border-bottom: 1px dashed #e2e2e2;
        }

        .voucher-totals .row.sub {
            padding-left: 14px;
            color: #666;
            font-size: 11.5px;
        }

        .voucher-totals .row.grand {
            border-top: 1.5px solid #222;
            border-bottom: none;
            margin-top: 6px;
            padding-top: 12px;
            font-size: 14px;
            font-weight: 800;
            color: #111;
        }

        .voucher-body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1 0 auto;
        }

        .voucher-remark-section {
            margin-top: 6px;
            margin-bottom: 6px;
        }

        .voucher-remark-section .val {
            min-height: 6px;
            padding-bottom: 2px;
        }

        .voucher-sign-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: auto;
            padding-top: 20px;
            padding-bottom: 12px;
            font-size: 12.5px;
            line-height: 1.75;
            color: #333;
            text-align: left;
        }

        .voucher-sign-row .line {
            border-top: 1px solid #777;
            margin-top: 36px;
            padding-top: 5px;
        }

        .voucher-footer {
            margin-top: 0;
            padding-top: 14px;
            border-top: 1px solid #ddd;
            font-size: 11.5px;
            color: #555;
            line-height: 1.75;
            text-align: left;
        }

        /* BACK PAGE — EXPANDED TO FILL FULL A4 */
        .terms-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .terms-header-row img {
            width: 75px;
            height: 75px;
            object-fit: cover;
        }

        .terms-header-row .inv-num {
            font-size: 13px;
            font-weight: 700;
            color: #333;
        }

        .terms-main-title {
            font-size: 17px;
            font-weight: 800;
            color: #2563eb;
            margin-bottom: 24px;
            padding-bottom: 10px;
            border-bottom: 2.5px solid #2563eb;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .terms-body {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            /* Distributes sections evenly */
        }

        .terms-section {
            margin-bottom: 20px;
        }

        .terms-section h4.blue-subhead {
            font-size: 13.5px;
            font-weight: 800;
            color: #2563eb;
            margin-bottom: 12px;
            line-height: 1.7;
            text-align: justify;
        }

        .terms-section ol,
        .terms-section ul {
            padding-left: 22px;
        }

        .terms-section li {
            font-size: 12.5px;
            line-height: 1.75;
            color: #222;
            margin-bottom: 10px;
            text-align: justify;
        }

        .terms-ack {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1.5px dashed #ccc;
        }

        .terms-ack p.ack-note {
            font-size: 12px;
            color: #2563eb;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
        }

        .terms-sign-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            font-size: 12px;
            color: #333;
            text-align: left;
        }

        .terms-sign-row .line {
            border-top: 1.5px solid #888;
            margin-top: 40px;
            padding-top: 6px;
        }

        .loading-spinner {
            text-align: center;
            padding: 30px;
            color: #666;
            display: none;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid #e5e5ea;
            border-top-color: #6c63ff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* STRICT A4 PRINT OPTIMIZATIONS */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }

            html,
            body {
                width: 210mm;
                height: 100%;
                background: #fff !important;
                margin: 0 !important;
                padding: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .app-bar,
            .search-card,
            .print-btn-row,
            .page-tag {
                display: none !important;
            }

            .container {
                padding: 0 !important;
                margin: 0 !important;
                max-width: 100% !important;
                width: 100% !important;
            }

            .invoice-wrap {
                display: block !important;
            }

            .a4-page {
                box-shadow: none !important;
                border-radius: 0 !important;
                width: 210mm !important;
                max-width: 210mm !important;
                min-height: 297mm !important;
                height: 297mm !important;
                padding: 18mm 20mm !important;
                margin: 0 !important;
                box-sizing: border-box !important;
                position: relative !important;
            }

            .a4-page.front {
                page-break-after: always !important;
                break-after: page !important;
            }

            .a4-page.back {
                page-break-after: avoid !important;
                break-after: avoid !important;
            }

            /* Adjust print spacing specifically for Back Page */
            .a4-page.back .terms-section li {
                font-size: 13px !important;
                line-height: 1.5 !important;
                margin-bottom: 12px !important;
            }

            .a4-page.back .terms-main-title {
                font-size: 18px !important;
                margin-bottom: 28px !important;
            }

            .a4-page.back .terms-sign-row .line {
                margin-top: 50px !important;
            }

            .watermark {
                font-size: 90px !important;
                opacity: 0.15 !important;
            }
        }
    </style>
</head>

<body>

    <div class="app-bar">
        <img src="/favicon.png" alt="iCrave" />
        <span>iCrave — Invoice</span>
    </div>

    <div class="container">
        <div class="search-card">
            <h2>🧾 Invoice ထုတ်မည်</h2>
            <div class="input-row">
                <input type="tel" id="imei-input" placeholder="IMEI ထည့်ပါ..." maxlength="15" inputmode="numeric" />
                <button class="btn-search" id="search-btn" onclick="searchPhone()">ရှာမည်</button>
            </div>
            <div class="buyer-row">
                <input type="text" id="buyer-name" placeholder="ဝယ်သူအမည်..." />
                <input type="text" id="buyer-phone" placeholder="ဖုန်းနံပါတ်..." />
            </div>
            <div class="buyer-row" style="margin-top:8px">
                <input type="text" id="warranty-period" placeholder="Warranty ကာလ (ဥပမာ - 3 လ)" />
                <input type="text" id="refund-pct" placeholder="ပြန်ရောင်း နုတ်ရမည့် % (ဥပမာ - 10)" />
            </div>
            <div class="buyer-row" style="margin-top:8px">
                <input type="text" id="exchange-pct" placeholder="အလဲအထပ် နုတ်ရမည့် % (ဥပမာ - 5)" />
                <input type="text" id="ceir-number" placeholder="CEIR (ရှိပါက)" />
            </div>
            <div class="buyer-row" style="margin-top:8px">
                <input type="text" id="ios-version" placeholder="iOS Version (ဥပမာ - iOS 17.5.1)" />
            </div>
            <div class="buyer-row" style="margin-top:8px">
                <input type="number" id="discount-amount" placeholder="Discount (Ks)" />
                <input type="number" id="paid-mmk" placeholder="Total Paid MMK (Ks)" />
            </div>
            <div class="buyer-row" style="margin-top:8px">
                <input type="number" id="paid-qr" placeholder="Paid by QR (Ks)" />
                <input type="number" id="paid-banking" placeholder="Paid by Banking (Ks)" />
            </div>
            <div class="buyer-row" style="margin-top:8px">
                <div class="foc-check-row">
                    <label><input type="checkbox" id="foc-charger" /> Power Adapter</label>
                    <label><input type="checkbox" id="foc-glass" /> မှန်မကွဲ (Tempered Glass)</label>
                    <label><input type="checkbox" id="foc-cable" /> Charging Cable</label>
                </div>
            </div>
            <div class="error-msg" id="error-msg"></div>
        </div>

        <div class="loading-spinner" id="loading">
            <div class="spinner"></div>
            Loading...
        </div>

        <div class="invoice-wrap" id="invoice-wrap">
            <div class="print-btn-row">
                <button class="btn-print" onclick="window.print()">🖨️ Print လုပ်မည် (Front + Back)</button>
                <button class="btn-reset" onclick="resetForm()">↺ အသစ်ထုတ်မည်</button>
            </div>

            <!-- FRONT: invoice details -->
            <div class="a4-page front" id="invoice-front">
                <div class="page-tag">FRONT — A4</div>
            </div>

            <!-- BACK: terms & conditions -->
            <div class="a4-page back" id="invoice-back">
                <div class="page-tag">BACK — A4</div>
            </div>
        </div>
    </div>

    <script>
        const SURL = 'https://bilowmtnmfymccbgvafz.supabase.co';
        const KEY = 'sb_publishable_kBWsQDvwBd5oixD5FxLu8w_062sRH_C';

        // ---- SHOP INFO ----
        const SHOP_NAME = 'iCrave';
        const SHOP_SUB = 'Premium Second Hand iPhones';
        const SHOP_ADDRESS = 'No.6, Paw Taw Mu 2<sup>nd</sup> Street, 2 Quarter, Thamine Junction, Mayangone Township, Yangon.';
        const SHOP_HOTLINE = '09789156464';
        const SHOP_CS_NUMBERS = ['09789156464', '09256423922', '09975038285', '09420158811'];
        // ------------------------------------

        function fmt(num) {
            if (!num && num !== 0) return '—';
            return Number(num).toLocaleString() + ' Ks';
        }

        document.getElementById('imei-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') searchPhone();
        });

        async function searchPhone() {
            const imei = document.getElementById('imei-input').value.trim();
            const errEl = document.getElementById('error-msg');
            errEl.style.display = 'none';

            if (!imei) { showError('IMEI ထည့်ပါ'); return; }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('invoice-wrap').style.display = 'none';
            document.getElementById('search-btn').disabled = true;

            try {
                const res = await fetch(`${SURL}/rest/v1/iphones?imei=eq.${encodeURIComponent(imei)}&select=*`, {
                    headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` }
                });
                const data = await res.json();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('search-btn').disabled = false;

                if (!data || data.length === 0) {
                    showError('ဒီ IMEI နဲ့ ဖုန်း မတွေ့ပါ');
                    return;
                }

                renderInvoice(data[0]);
            } catch (e) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('search-btn').disabled = false;
                showError('Error: ' + e.message);
            }
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function renderInvoice(p) {
            const buyer = document.getElementById('buyer-name').value.trim() || '—';
            const buyerPhone = document.getElementById('buyer-phone').value.trim() || '—';
            const now = new Date();
            const today = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            const timeNow = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
            const invNo = 'INV-' + Date.now().toString().slice(-6);
            const price = Number(p.sell_price || p.buy_price || 0);

            const blank = (v) => v ? v : '_______';
            const warrantyPeriod = blank(document.getElementById('warranty-period').value.trim());
            const refundPct = blank(document.getElementById('refund-pct').value.trim());
            const exchangePct = blank(document.getElementById('exchange-pct').value.trim());
            const ceirNumber = document.getElementById('ceir-number').value.trim();
            const iosVersion = document.getElementById('ios-version').value.trim();

            const focItems = [];
            if (document.getElementById('foc-charger').checked) focItems.push('Power Adapter');
            if (document.getElementById('foc-glass').checked) focItems.push('မှန်မကွဲ (Tempered Glass)');
            if (document.getElementById('foc-cable').checked) focItems.push('Charging Cable');

            const discount = Number(document.getElementById('discount-amount').value) || 0;
            const paidMMK = Number(document.getElementById('paid-mmk').value) || 0;
            const paidQR = Number(document.getElementById('paid-qr').value) || 0;
            const paidBank = Number(document.getElementById('paid-banking').value) || 0;
            const paidSum = paidMMK + paidQR + paidBank;
            const totalReceived = paidSum > 0 ? paidSum : (price - discount);

            const ks = (n) => n ? Number(n).toLocaleString() : '—';

            const focRows = focItems.map((item, i) => `
          <div class="item-list-row foc">
            <span>${i + 2}</span>
            <span>${item}</span>
            <span>—</span>
            <span>—</span>
            <span class="num">1</span>
            <span class="num">FOC</span>
          </div>`).join('');

            // ---- FRONT PAGE ----
            document.getElementById('invoice-front').innerHTML = `
    <div class="page-tag">FRONT — A4</div>
    <div class="watermark">${SHOP_NAME}</div>
    <div class="voucher-body">
      <div>
        <div class="voucher-header">
          <img class="voucher-logo" src="/favicon.png" alt="${SHOP_NAME}" />
        </div>

        <div class="voucher-top-row">
          <div class="voucher-field"><span class="lbl">Invoice No</span><span class="val">${invNo}</span></div>
          <div class="voucher-field"><span class="lbl">Invoice Date</span><span class="val">${today}</span></div>
          <div class="voucher-field"><span class="lbl">Invoice Time</span><span class="val">${timeNow}</span></div>
        </div>
